minimum_pre_commit_version: "3.6.0"

default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks git --staged
        entry: gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        always_run: true

      - id: golangci-lint-fmt
        name: golangci-lint fmt --diff
        entry: golangci-lint fmt --diff
        language: system
        pass_filenames: false
        always_run: true

      - id: golangci-lint-run
        name: golangci-lint run
        entry: golangci-lint run
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test-race
        name: go test -race ./...
        entry: go test -race ./...
        language: system
        pass_filenames: false
        always_run: true

      - id: go-build
        name: go build ./...
        entry: go build ./...
        language: system
        pass_filenames: false
        always_run: true
